[env:native]
platform = native
test_framework = unity
build_type = debug
build_flags =
    ; c++14 for less strict constexpr
    -std=c++14
    -UUNITY_INCLUDE_CONFIG_H
    -I .pio/libdeps/native/Unity/src
    -I include
    -I test/mocks
    -D IS_NATIVE=1
    -D ENABLE_VALIDATE_CAN=1
lib_deps =
    throwtheswitch/Unity@^2.5.2

lib_ldf_mode = deep+
